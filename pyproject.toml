[project]
name = "nanobananabot"
version = "0.1.0"
description = "Multimodal AI generation Telegram bot (images, video, music)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles==25.1.0",
    "aiogram==3.24.0",
    "aiohappyeyeballs==2.6.1",
    "aiohttp==3.13.3",
    "aiomysql==0.3.2",
    "aiosignal==1.4.0",
    "alembic==1.17.2",
    "annotated-types==0.7.0",
    "anyio==4.12.1",
    "attrs==25.4.0",
    "certifi==2026.1.4",
    "cffi==2.0.0",
    "charset-normalizer==3.4.4",
    "click==8.3.1",
    "colorama==0.4.6",
    "cryptography==46.0.3",
    "curl-cffi==0.6.4",
    "frozenlist==1.8.0",
    "greenlet==3.3.0",
    "h11==0.16.0",
    "idna==3.11",
    "magic-filter==1.0.12",
    "mako==1.3.10",
    "markdown-it-py==4.0.0",
    "markupsafe==3.0.3",
    "mdurl==0.1.2",
    "msgspec==0.20.0",
    "multidict==6.7.0",
    "openai==1.68.0",
    "pre-commit>=4.5.1",
    "propcache==0.4.1",
    "pycparser==2.23",
    "pydantic==2.12.5",
    "pydantic-core==2.41.5",
    "pydantic-settings==2.14.2",
    "pygments==2.19.2",
    "pymysql==1.1.2",
    "python-dotenv==1.2.1",
    "pytz>=2025.2",
    "pyyaml==6.0.3",
    "redis==7.1.0",
    "runware>=0.4.0",
    "requests==2.32.5",
    "rich==13.9.4",
    "shellingham==1.5.4",
    "sqlalchemy==2.0.45",
    "typer==0.10.0",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "urllib3==2.6.2",
    "uvloop==0.22.1",
    "websockets==15.0.1",
    "yarl==1.22.0",
    "deep-translator>=1.11.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# Помимо дефолтных E/F включаем наборы, важные для async-бота и перфа:
#   ASYNC — блокирующие вызовы в корутинах; PERF — перф-антипаттерны;
#   C4/PIE/FURB/SIM/UP — устранение лишних аллокаций и устаревших идиом;
#   B/RUF — классы багов (висящие задачи, mutable defaults и т.п.).
select = ["E", "F", "W", "ASYNC", "PERF", "C4", "B", "SIM", "UP", "RUF", "PIE", "FLY", "FURB"]
ignore = [
    # Кириллица в строках/комментариях помечается как «неоднозначные» символы —
    # это весь UI-текст бота, ложные срабатывания.
    "RUF001",
    "RUF002",
    "RUF003",
    # timeout пробрасывается в aiohttp.ClientTimeout намеренно, asyncio.timeout
    # тут не нужен.
    "ASYNC109",
    # Ширину строк определяет `ruff format`; оставшиеся длинные строки — это
    # неразрывный UI-текст/URL, ломать их в ущерб читаемости смысла нет.
    "E501",
    # str-Enum → StrEnum меняет семантику str(member) и может незаметно сломать
    # f-строки и сравнения с `.value`.
    "UP042",
    # Явная вложенность `async with sessionmaker()` / `session.begin()` нагляднее
    # показывает границы сессии и транзакции, чем слитный однострочник.
    "SIM117",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.1.0",
    "py-spy>=0.4.2",
    "radon>=6.0.1",
    "safety>=3.2.11",
]

[tool.bandit]
# bot/scheduler.py — вкомпиленная копия библиотеки `schedule`; её assert/random
# не наши и не несут риска. Остальной код сканируется полностью.
exclude_dirs = ["tests", "bot/scheduler.py"]

[tool.mypy]
python_version = "3.12"
files = ["bot"]
# bot/ — namespace-пакет без верхнеуровневого __init__; явная база пакетов
# не даёт mypy резолвить один файл и как utils.x, и как bot.utils.x.
explicit_package_bases = true
mypy_path = "."
# Прагматичный набор: ловим реальные ошибки несоответствия типов, не требуя
# аннотировать каждую функцию (база писалась не под mypy).
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true

# Сторонние пакеты без type-стабов: не зашумляем отчёт «import-untyped».
[[tool.mypy.overrides]]
module = [
    "runware.*",
    "aiomysql.*",
    "magic_filter.*",
    "pytz.*",
]
ignore_missing_imports = true

# bot/scheduler.py — вкомпиленная копия библиотеки `schedule` с динамическими
# паттернами, которые mypy ложно помечает unreachable/not-callable. Чужой код,
# не переписываем под типизацию.
[[tool.mypy.overrides]]
module = ["bot.scheduler"]
ignore_errors = true

# pydantic-settings BaseSettings заполняет поля из окружения, поэтому mypy
# ошибочно требует все аргументы конструктора и не понимает nested default_factory.
[[tool.mypy.overrides]]
module = ["bot.settings"]
disable_error_code = ["call-arg", "arg-type"]

# В контексте хендлера aiogram гарантирует ненулевые `message.bot`,
# `callback.message`, `event_from_user`, но типизирует их как Optional. Реальная
# логика (utils/db) проверяется строго — там подобный шум не глушится.
[[tool.mypy.overrides]]
module = ["bot.handlers.*"]
disable_error_code = ["union-attr"]
